<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة إدارة المتجر</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#092c56;font:16px Tahoma,Arial,sans-serif}header{background:#092c56;color:white;text-align:center;padding:24px}h1{color:#ffca28;margin:0 0 10px}main{max-width:1100px;margin:24px auto;padding:16px}section,article{background:white;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #092c5612}#login{max-width:460px;margin:auto}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #ccd7e4;max-width:100%}input,select{width:100%}button{background:#ffca28;color:#092c56;font-weight:bold;cursor:pointer;margin:5px 0;border:0}button:disabled{opacity:.5}header,article{overflow-wrap:anywhere}[hidden]{display:none!important}.line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.line>*{flex:1;min-width:110px}.muted{color:#54687c}#msg{white-space:pre-wrap}a{color:#07529b}.photo{display:block;margin:8px 0}img{max-width:220px;max-height:180px;object-fit:contain}h2,h3{margin-top:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:16px 0}.stat{background:#eef3fa;border:1px solid #d8e2ee;border-radius:10px;padding:12px;text-align:center}.stat strong{display:block;font-size:24px;margin-top:6px}.filters{margin:16px 0}.state{display:inline-block;padding:5px 10px;border-radius:8px;background:#e8edf4;font-size:14px}.state-pending_review{background:#fff1c2;color:#765000}.state-quoted{background:#dcecff;color:#16477c}.state-preparing,.state-ready_to_ship,.state-shipped{background:#dcecff;color:#16477c}.state-accepted,.state-completed{background:#daf2e2;color:#176039}.state-rejected,.state-cancelled{background:#fde4e4;color:#922b2b}@media(max-width:600px){main{padding:10px;margin:12px auto}section,article{padding:14px}.line>*{min-width:135px}.filters>*{flex-basis:100%}} </style></head><body><header><h1>جوتیارێن سێمێلێ</h1>لوحة إدارة المتجر</header><main><section id="login"><h2>تسجيل دخول المدير</h2><form id="form"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button>تسجيل الدخول</button>
<p style="text-align:center;margin-top:12px">

<a href="#" onclick="sendPasswordReset(); return false;">نسيت كلمة المرور؟</a>
</p>
</form><p><a href="index.html">العودة إلى المتجر</a></p></section><section id="dash" hidden><div class="line"><h2>طلبات الزبائن</h2><button id="reload">تحديث الطلبات</button><button id="logout">تسجيل الخروج</button></div><div id="stats" class="stats"></div><div class="line filters"><label>البحث<input id="search" placeholder="اسم الزبون أو الهاتف أو الموديل"></label><label>حالة الطلب<select id="filter"><option value="">جميع الحالات</option></select></label></div><p id="count"></p><div id="requests"></div></section><p id="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';const db=supabase.createClient('https://mxkfwnvxoopvpgmeaues.supabase.co','sb_publishable_JC8lC-84DP0I5X3bAh_jGQ_edoMo4mZ',{auth:{persistSession:false}});const $=id=>document.getElementById(id);let active=false,busy=false;const statusNames={pending_review:'قيد المراجعة',quoted:'تم إعداد العرض',accepted:'مقبول',rejected:'مرفوض',cancelled:'ملغى',preparing:'قيد التجهيز',ready_to_ship:'جاهز للشحن',shipped:'تم الشحن',completed:'مكتمل'};function el(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}function say(t){$('msg').textContent=t}function check(r){if(r.error)throw r.error;return r.data}function btn(parent,text,fn){const b=el('button',text,parent);b.type='button';b.onclick=()=>{if(!busy&&active)fn()};return b}async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){say('تعذر التنفيذ: '+(e.message||'خطأ غير معروف'))}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('form').onsubmit=e=>{e.preventDefault();run(async()=>{try{check(await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}));if(check(await db.rpc('is_store_admin'))!==true)throw Error('الحساب ليس مديراً');active=true;$('form').reset();$('login').hidden=true;$('dash').hidden=false;}catch(e){await db.auth.signOut();throw e}await load()})};$('reload').onclick=()=>run(load);$('logout').onclick=()=>run(async()=>{check(await db.auth.signOut());active=false;allRows=[];$('stats').replaceChildren();$('search').value='';$('filter').value='';$('requests').replaceChildren();$('dash').hidden=true;$('login').hidden=false;say('تم تسجيل الخروج')});
async function photo(parent,path,label){if(!path)return;const p=el('p',label+' — ',parent);try{if(typeof path!=='string'||/^https?:/i.test(path))throw Error('مسار غير متوقع');const key=path.replace(/^request-images\//,'');const data=check(await db.storage.from('request-images').createSignedUrl(key,300));const a=el('a','فتح الصورة',p);a.href=data.signedUrl;a.target='_blank';a.rel='noopener noreferrer';const img=el('img',undefined,a);img.src=data.signedUrl;img.alt=label;img.loading='lazy';}catch(e){el('span','تعذر عرض الصورة',p)}}
let allRows=[];for(const [key,label] of Object.entries(statusNames)){const o=el('option',label,$('filter'));o.value=key}function applyFilters(){const q=$('search').value.trim().toLowerCase(),status=$('filter').value;let shown=0;for(const card of $('requests').children){card.hidden=!!((status&&card.dataset.status!==status)||(q&&!card.dataset.search.includes(q)));if(!card.hidden)shown++}$('count').textContent='عدد الطلبات المعروضة: '+shown+' من '+allRows.length} $('search').oninput=applyFilters;$('filter').onchange=applyFilters;function stats(rows){$('stats').replaceChildren();for(const [k,t] of [['','جميع الطلبات'],...Object.entries(statusNames)]){const c=el('div',t,$('stats'));c.className='stat';el('strong',String(k?rows.filter(r=>r.status===k).length:rows.length),c)}}async function load(){say('جارٍ تحميل الطلبات...');const rows=check(await db.from('customer_requests').select('*').order('created_at',{ascending:false}));$('requests').replaceChildren();allRows=rows;stats(rows);for(const r of rows)render(r);applyFilters();say('')}
function render(r){const card=el('article',undefined,$('requests'));card.dataset.status=r.status;card.dataset.search=[r.customer_name,r.phone,r.machine_model,r.id].join(' ').toLowerCase();const heading=el('h3',r.customer_name+' ',card);const badge=el('span',statusNames[r.status]||r.status,heading);badge.className='state state-'+r.status;el('p','تاريخ الطلب: '+(r.created_at?new Date(r.created_at).toLocaleString('ar-IQ',{timeZone:'Asia/Baghdad'}):'—'),card);for(const [k,v] of [['الهاتف',r.phone],['المحافظة',r.governorate],['العنوان',r.address_text],['الآلة',r.machine_type],['الموديل',r.machine_model],['الرقم التسلسلي',r.serial_number],['الملاحظات',r.notes],['رقم الطلب',r.id]])el('p',k+': '+(v||'—'),card);const next={accepted:'preparing',preparing:'ready_to_ship',ready_to_ship:'shipped',shipped:'completed'}[r.status];if(next){const actions=el('div',undefined,card);btn(actions,'تغيير الحالة إلى: '+statusNames[next],()=>{if(!confirm('تأكيد تغيير حالة الطلب إلى '+statusNames[next]+'؟'))return;run(async()=>{check(await db.from('customer_requests').update({status:next}).eq('id',r.id).eq('status',r.status).select('id').single());await load();say('تم تحديث حالة الطلب.')})})}const detail=el('div',undefined,card);btn(card,'عرض الصور والقطع',()=>run(async()=>{detail.replaceChildren();await photo(detail,r.serial_plate_image,'لوحة الرقم التسلسلي');for(const p of r.damaged_part_images||[])await photo(detail,p,'صورة القطعة');const items=check(await db.from('request_items').select('*').eq('request_id',r.id).order('created_at'));editor(detail,r,items)}))}
function editor(parent,r,items){el('h3','القطع وعرض السعر (USD)',parent);const list=el('div',undefined,parent),total=el('p','',parent);const fields=[];const editable=r.status==='pending_review';function recalc(){let sum=0;for(const f of fields)if(f.av.value==='yes')sum+=Number(f.qty.value||0)*Number(f.price.value||0);total.textContent='الإجمالي للقطع المتوفرة: $'+sum.toFixed(2)}function add(item={}){const row=el('div',undefined,list);row.className='line';function input(label,type,value){const l=el('label',label,row),n=el('input',undefined,l);n.type=type;n.value=value??'';n.disabled=!editable;n.oninput=recalc;return n}const name=input('اسم القطعة','text',item.part_name??''),qty=input('الكمية','number',item.quantity??1),price=input('سعر الوحدة $','number',item.quoted_unit_price_usd);qty.min='1';qty.step='1';price.min='0';price.step='0.01';const l=el('label','التوفر',row),av=el('select',undefined,l);for(const [v,t] of [['','غير محدد'],['yes','متوفر'],['no','غير متوفر']]){const o=el('option',t,av);o.value=v}av.value=item.available===true?'yes':item.available===false?'no':'';av.disabled=!editable;av.onchange=recalc;const f={item,name,qty,price,av};fields.push(f);if(editable&&!item.id)btn(row,'إزالة',()=>{fields.splice(fields.indexOf(f),1);row.remove();recalc()});recalc()}items.forEach(add);if(editable){btn(parent,'إضافة قطعة',()=>add());btn(parent,'حفظ الأسعار (مسودة)',()=>run(()=>save(false)));btn(parent,'اعتماد عرض السعر',()=>{if(confirm('اعتماد العرض وتغيير حالة الطلب؟'))run(()=>save(true))})}else el('p','هذا الطلب ليس قيد المراجعة؛ الأسعار للعرض فقط.',parent);recalc();async function save(publish){if(!fields.length)throw Error('أضف قطعة واحدة على الأقل');const data=fields.map(f=>{const name=f.name.value.trim(),q=Number(f.qty.value),p=f.price.value===''?null:Number(f.price.value),a=f.av.value==='yes'?true:f.av.value==='no'?false:null;if(!name||!Number.isSafeInteger(q)||q<1||q>2147483647||!f.price.validity.valid||p!==null&&(!Number.isFinite(p)||p<0))throw Error('تحقق من الاسم والكمية والسعر');if(publish&&(a===null||a&&p===null))throw Error('حدد توفر كل قطعة وسعر القطع المتوفرة');return {f,payload:{part_name:name,quantity:q,available:a,quoted_unit_price_usd:a===false?null:p}}});const current=check(await db.from('customer_requests').select('status').eq('id',r.id).single());if(current.status!=='pending_review')throw Error('تغيرت حالة الطلب؛ حدّث القائمة');for(const {f,payload} of data){const result=f.item.id?await db.from('request_items').update(payload).eq('id',f.item.id).eq('request_id',r.id).select('id').single():await db.from('request_items').insert({...payload,request_id:r.id}).select('id').single();f.item.id=check(result).id}if(publish)check(await db.from('customer_requests').update({status:'quoted'}).eq('id',r.id).eq('status','pending_review').select('id').single());await load();say(publish?'تم اعتماد العرض في قاعدة البيانات.':'تم حفظ المسودة.')}}

async function sendPasswordReset() {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    alert('يرجى إدخال البريد الإلكتروني أولاً');
    return;
  }

  try {
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://jotyarensemele-story.pages.dev/reset-password.html'
    });

    if (error) throw error;

    alert('إذا كان البريد مسجلاً، فستصلك رسالة تحتوي على رابط استعادة كلمة المرور.');
  } catch (error) {
    alert('تعذر إرسال طلب الاستعادة: ' + error.message);
  }
}

</script></body></html>
