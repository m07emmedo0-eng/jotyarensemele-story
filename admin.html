 
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إدارة المتجر</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#f4f7fb;
  color:#092c56;
}
header{
  background:#092c56;
  color:white;
  padding:30px 15px;
  text-align:center;
}
header h1{color:#ffca28;margin:0 0 12px}
.panel{
  background:white;
  max-width:460px;
  margin:45px auto;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px #092c5615;
}
h2{text-align:center}
label{display:block;margin:18px 0 8px}
input{
  width:100%;
  padding:14px;
  border:1px solid #ccd7e4;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  margin-top:22px;
  padding:15px;
  background:#ffca28;
  color:#092c56;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
#message{
  text-align:center;
  line-height:1.8;
  overflow-wrap:anywhere;
}
#dashboard{max-width:900px}
[hidden]{display:none!important}
a{color:#07529b}
@media(max-width:520px){
  .panel{margin:25px 15px;padding:22px}
}
</style>
</head>
<body>

<header>
  <h1>جوتیارێن سێمێلێ</h1>
  <div>لوحة إدارة المتجر</div>
</header>

<section class="panel" id="loginPanel">
  <h2>تسجيل دخول المدير</h2>
  <form id="loginForm">
    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email"
      autocomplete="username" required>

    <label for="password">كلمة المرور</label>
    <input id="password" type="password"
      autocomplete="current-password" required>

    <button id="loginButton" type="submit">
      تسجيل الدخول
    </button>
  </form>
  <p style="text-align:center">
    <a href="index.html">العودة إلى المتجر</a>
  </p>
</section>

<section class="panel" id="dashboard" hidden>
  <h2>مرحباً بك في لوحة الإدارة</h2>
  <p>تم التحقق من صلاحيات المدير بنجاح.</p>
  <p>سيتم إضافة إدارة الطلبات وعروض الأسعار في المرحلة التالية.</p>
  <button id="logoutButton">تسجيل الخروج</button>
</section>

<p id="message" role="status"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = supabase.createClient(
  'https://mxkfwnvxoopvpgmeaues.supabase.co',
  'sb_publishable_JC8lC-84DP0I5X3bAh_jGQ_edoMo4mZ',
  {
    auth: {
      persistSession: false
    }
  }
);

const loginForm = document.getElementById('loginForm');
const loginPanel = document.getElementById('loginPanel');
const dashboard = document.getElementById('dashboard');
const message = document.getElementById('message');
const loginButton = document.getElementById('loginButton');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginButton.disabled = true;
  message.textContent = 'جارٍ التحقق من الحساب...';

  try {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = 'تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.';
      return;
    }

    const { data, error: adminError } =
      await db.rpc('is_store_admin');

    if (adminError || data !== true) {
      await db.auth.signOut();
      message.textContent = 'لم يتم التحقق من صلاحيات الإدارة.';
      return;
    }

    loginForm.reset();
    loginPanel.hidden = true;
    dashboard.hidden = false;
    message.textContent = '';

  } catch (error) {
    await db.auth.signOut();
    message.textContent = 'حدث خطأ في الاتصال. حاول مجدداً.';
  } finally {
    loginButton.disabled = false;
  }
});

document.getElementById('logoutButton')
  .addEventListener('click', async () => {
    dashboard.hidden = true;
    await db.auth.signOut();
    loginPanel.hidden = false;
    message.textContent = 'تم تسجيل الخروج.';
  });
</script>

</body>
</html>
