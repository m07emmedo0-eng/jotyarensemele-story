
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>جوتیارێن سێمێلێ</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f7fb;
      color: #172b4d;
    }
    header {
      background: #003b7a;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    main {
      max-width: 950px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
    }
    .search {
      width: 90%;
      max-width: 550px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 250px;
      box-shadow: 0 3px 12px #0001;
    }
    .card h2 { color: #003b7a; }
    footer {
      text-align: center;
      padding: 25px;
      background: #e8eef5;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>جوتیارێن سێمێلێ</h1>
    <p>قطع غيار جرارات وحاصدات New Holland</p>
  </header>

  <main>
    <h2>ابحث عن القطعة المناسبة لآلتك</h2>
    <input class="search"
           type="search"
           placeholder="اسم القطعة أو موديل الآلة">

    <div class="cards">
      <div class="card">
        <h2>قطع الجرارات</h2>
        <p>TM - T7000 - T7 - TD - T6</p>
      </div>
      <div class="card">
        <h2>قطع الحاصدات</h2>
        <p>TC54 - TC56 - TC5070</p>
      </div>
    </div>
  </main>

  <footer>
    <p>دهوك - صناعة دهوك الجديدة - آلوكا</p>
    <p>جميع محافظات العراق</p>
  </footer>
</body>
</html>
