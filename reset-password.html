
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>استعادة كلمة المرور | جوتیارێن سێمێلێ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      font-family: Tahoma, Arial, sans-serif;
      color: #092c56;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px #092c5615;
    }
    h1 { font-size: 23px; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd5e0; }
    button {
      background: #092c56;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { line-height: 1.8; }
    a { color: #1255a0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>جوتیارێن سێمێلێ</h1>
    <h2>تعيين كلمة مرور جديدة</h2>
    <p>افتح رابط الاستعادة المرسل إلى بريدك الإلكتروني.</p>

    <form id="resetForm" hidden>
      <input id="password" type="password"
        placeholder="كلمة المرور الجديدة"
        autocomplete="new-password"
        minlength="12" required>
      <input id="confirm" type="password"
        placeholder="تأكيد كلمة المرور"
        autocomplete="new-password"
        minlength="12" required>
      <button id="save" type="submit">
        حفظ كلمة المرور
      </button>
    </form>

    <p id="message" role="status" aria-live="polite">
      جارٍ التحقق من رابط الاستعادة...
    </p>
    <a href="admin.html">العودة إلى تسجيل دخول المدير</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://mxkfwnvxoopvpgmeaues.supabase.co";

const SUPABASE_KEY = "sb_publishable_JC8lC-84DP0I5X3bAh_jGQ_edoMo4mZ";
    const message = document.getElementById("message");
    const form = document.getElementById("resetForm");
    const save = document.getElementById("save");

    function showMessage(text) {
      message.textContent = text;
    }

    async function init() {
      if (SUPABASE_KEY === "PASTE_PUBLISHABLE_KEY_HERE") {
        showMessage("يجب إعداد المفتاح العام أولاً.");
        return;
      }

      const db = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            detectSessionInUrl: true,
            persistSession: false,
            autoRefreshToken: false
          }
        }
      );

      let recoveryVerified = false;

      db.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") {
          recoveryVerified = true;
          form.hidden = false;
          showMessage("أدخل كلمة المرور الجديدة.");
        }
      });

      const params = new URLSearchParams(
        window.location.search
      );

      const code = params.get("code");
      const tokenHash = params.get("token_hash");
      const type = params.get("type");

      try {
        if (tokenHash && type === "recovery") {
          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: "recovery"
          });
          if (error) throw error;
          recoveryVerified = true;
        } else if (code) {
          const { error } =
            await db.auth.exchangeCodeForSession(code);
          if (error) throw error;
          recoveryVerified = true;
        } else if (
          window.location.hash.includes("access_token=")
        ) {
          const { data, error } = await db.auth.getSession();
          if (error) throw error;
          recoveryVerified = !!data.session;
        }

        if (recoveryVerified) {
          form.hidden = false;
          showMessage("أدخل كلمة المرور الجديدة.");
          history.replaceState(
            null, "",
            window.location.pathname
          );
        } else {
          showMessage(
            "رابط الاستعادة غير صالح أو انتهت صلاحيته. " +
            "اطلب رابطاً جديداً من صفحة الدخول."
          );
        }
      } catch (err) {
        showMessage(
          "تعذر التحقق من رابط الاستعادة. " +
          "اطلب رابطاً جديداً."
        );
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!recoveryVerified) return;

        const password =
          document.getElementById("password").value;
        const confirm =
          document.getElementById("confirm").value;

        if (password !== confirm) {
          showMessage("كلمتا المرور غير متطابقتين.");
          return;
        }

        save.disabled = true;
        showMessage("جارٍ حفظ كلمة المرور...");

        const { error } = await db.auth.updateUser({
          password
        });

        if (error) {
          showMessage("تعذر الحفظ: " + error.message);
          save.disabled = false;
          return;
        }

        form.hidden = true;
        showMessage(
          "تم تغيير كلمة المرور بنجاح. " +
          "يمكنك الآن تسجيل الدخول."
        );
        await db.auth.signOut();
      });
    }

    init();
  </script>
</body>
</html>
